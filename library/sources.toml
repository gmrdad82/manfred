# The library's bake recipe: every original object of library/, one place each, from Manfred's own generators. bin/library bakes them.
manfred = 1
name = "library"
seed = 1816

[[object]]
name = "coupe"
kind = "generator"
generator = "manfred/car"
at = [0.0, 0.0, 0.0]
params = { style = "sports", seed = 1, paint = "#17191d" }

