[timeline]
fps = 60
seconds = 10.0
size = [1080, 1920]

[[route]]
name = "main"
points = [
  [0.0, 0.0, 0.0],
  [12.8, 0.0, 81.5],
  [14.0, 0.0, 163.1],
  [0.3, 0.0, 244.6],
  [-16.0, 0.0, 326.1],
  [-23.2, 0.0, 407.7],
  [-18.6, 0.0, 489.2],
  [0.0, 0.0, 570.7],
]

