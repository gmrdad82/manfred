# Manfred's own feature scene: a toy box on a backdrop, in plate pixels with depth along -Z.
# It belongs to no app; every material is its own.
manfred = 1
name = "toybox"
seed = 7

[plate]
width = 1600
height = 1000
metres_per_pixel = 0.0004
origin = "top_left"

[output]
glb = "toybox.glb"
sidecar = "toybox.json"
sidecar_dialect = "facts"
order = "natural"

