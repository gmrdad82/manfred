materials = ["toybox.materials.toml"]

[sun]
model = "authored"
toward = [0.45, 0.62, 0.64]
color = [1.0, 0.9, 0.8]
irradiance = 3.0
hour = 16.0
reference_hour = 16.0
radius = 0.8

[sky]
kind = "analytic"
ambient = 0.9

[camera]
projection = "perspective"
at = [0.6, 0.9, 1.2]
look_at = [0.0, -0.05, 0.0]
up = [0.0, 1.0, 0.0]
focal = 50.0
sensor = 22.499999999999996
fstop = 4.0
near = 0.6265480181213484
far = 2.3672833670145397

[finish]

[[finish.pass]]
exposure = 1.0

[[finish.pass]]
bloom = { kind = "tent", strength = 0.08, threshold = 0.9, knee = 0.7, knee_width = 0.6, soft = 0.15, radius = 12, sigma = 50.0, down = 2 }

[[finish.pass]]
vignette = { kind = "power", strength = 0.2, power = 2.4, aspect = 0.8, scale = 1.28 }

[[finish.pass]]
saturation = 1.0

[[finish.pass]]
warmth = { kind = "linear", amount = 0.05 }

[[finish.pass]]
tone = "aces"

