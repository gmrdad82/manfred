name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (linux-x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TAG: ${{ github.ref_name }}
      NAME: manfred-${{ github.ref_name }}-linux-x86_64.tar.gz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: 1.97.1
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libwayland-dev
      - name: the tag matches the package version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          [ "v$version" = "$TAG" ] || { echo "tag $TAG is not v$version" >&2; exit 1; }
      - run: cargo build --release --locked --bin manfred
      - name: pack
        run: |
          mkdir -p dist/pack/licenses
          cp target/release/manfred LICENSE NOTICE README.md dist/pack/
          cp assets/licenses/Apache-2.0.txt assets/fonts/OFL.txt dist/pack/licenses/
          cp -r share dist/pack/share
          mkdir -p dist/pack/bin
          cp bin/register-filetypes dist/pack/bin/
          tar -czf "dist/$NAME" -C dist/pack manfred LICENSE NOTICE README.md licenses share bin
      - name: docs bundle
        run: bin/docs-bundle --bin target/release/manfred --out dist
      - name: object library
        run: |
          if [ ! -f library/index.json ]; then
            echo "no library/ yet; skipping library-$TAG.zip"
            exit 0
          fi
          find library -exec touch -h -d '2026-01-01 00:00:00 UTC' {} +
          find library -type f | LC_ALL=C sort | zip -X -q -@ "dist/library-$TAG.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: linux-x86_64
          path: |
            dist/${{ env.NAME }}
            dist/docs-${{ env.TAG }}.tar.gz
            dist/library-${{ env.TAG }}.zip
          if-no-files-found: error
          retention-days: 1

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          path: dist
          merge-multiple: true
      - name: checksums
        working-directory: dist
        run: |
          shopt -s nullglob
          sha256sum manfred-* docs-* library-* > SHA256SUMS && cat SHA256SUMS
      - name: notes from the changelog
        run: |
          awk -v version="${TAG#v}" '
            /^## / { if (found) exit; if (index($0, version)) { found = 1; next } }
            found
          ' CHANGELOG.md > notes.md
          grep -q '[^[:space:]]' notes.md || { echo "CHANGELOG.md has no section for $TAG" >&2; exit 1; }
          cat notes.md
      - name: release
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --notes-file notes.md
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "Manfred ${TAG#v}" --notes-file notes.md --verify-tag
          fi
